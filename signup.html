<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EdukaMadrid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="assets/logos/icon_32.png">
    <link rel="stylesheet" href="bootstrap/public/css/bootstrap.min.css">
    <link rel="stylesheet" href="stylesheets/styles.css">
</head>

<body class="vh-100 m-0">
    <nav class="navbar navbar-expand-md fixed-top bg-transparent shadow-none">
        <div class="container-fluid text-center justify-content-center">
            <a href="/index.html" class="navbar-brand mx-0">
                <h1 class=""><span class="eduka">Eduka</span>Madrid</h1>
            </a>
        </div>
    </nav>
    <main class="container h-100 align-content-center">
        <form class="row has-validation" action="#" method="POST">
            <div class="col-6">
                <label for="input_name" class="form-label">Nombre</label>
                <input class="form-control" id="input_name" type="text" placeholder="John" required>
            </div>
            <div class="col-6">
                <label for="input_surname" class="form-label">Apellidos</label>
                <input class="form-control" id="input_surname" type="text" placeholder="Doe" required>
            </div>
            <div class="col-12">
                <label for="input_email" class="form-label mt-3">Email</label>
                <input class="form-control" id="input_email" type="email" placeholder="name@example.com" required>
                <label for="input_passwd" class="form-label mt-3">Contraseña</label>
                <input class="form-control" id="input_passwd" type="password" placeholder="Escribe aquí tu contraseña" autocomplete="new-password" required>
                <label for="input_conf_passwd" class="form-label mt-3">Confirmar contraseña</label>
                <input class="form-control" id="input_conf_passwd" type="password" placeholder="Repite la contraseña" autocomplete="new-password" required>
                <button class="btn w-100 mt-4" type="submit">Registrarse</button>
            </div>
        </form>
    </main>
    <footer class="modal-footer justify-content-between fixed-bottom">
        <p>Centro de formación y gestión académica</p>
        <p>&copy; 2026 EdukaMadrid</p>
        <p>By Daniel Maksymiv &amp; Guillermo Patiño</p>
    </footer>
    <script src="bootstrap/public/js/bootstrap.bundle.min.js"></script>
</body>

</html>
